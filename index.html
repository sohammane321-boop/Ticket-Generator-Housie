<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Housie / Tambola Ticket Generator</title>
<style>
  :root{
    --ink:#1b2430;
    --paper:#ffffff;
    --accent:#c0392b;
    --accent2:#1f6f5c;
    --grid-line:#1b2430;
    --blank-bg:#eef1f4;
    --page-bg:#f2f4f7;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--page-bg);
    color:var(--ink);
    padding-bottom:60px;
  }

  /* ---------- Controls ---------- */
  .toolbar{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--ink);
    color:#fff;
    padding:16px 24px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
    box-shadow:0 3px 10px rgba(0,0,0,0.25);
  }

  .toolbar h1{
    font-size:1.15rem;
    margin:0;
    margin-right:12px;
    letter-spacing:.3px;
    white-space:nowrap;
  }

  .field{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .field label{
    font-size:.85rem;
    opacity:.85;
    white-space:nowrap;
  }

  .field input[type=number]{
    width:80px;
    padding:8px 10px;
    border-radius:6px;
    border:1px solid #4b5a6a;
    background:#26313f;
    color:#fff;
    font-size:.95rem;
  }
  .field input[type=number]:focus{
    outline:2px solid var(--accent2);
  }

  .field select{
    padding:8px 10px;
    border-radius:6px;
    border:1px solid #4b5a6a;
    background:#26313f;
    color:#fff;
    font-size:.95rem;
  }
  .field select:focus{
    outline:2px solid var(--accent2);
  }

  button{
    cursor:pointer;
    border:none;
    border-radius:6px;
    padding:10px 18px;
    font-size:.9rem;
    font-weight:600;
    letter-spacing:.2px;
    transition:transform .05s ease, opacity .15s ease;
  }
  button:active{ transform:translateY(1px); }

  #generateBtn{
    background:var(--accent2);
    color:#fff;
  }
  #generateBtn:hover{ opacity:.9; }

  #printBtn{
    background:var(--accent);
    color:#fff;
  }
  #printBtn:hover{ opacity:.9; }

  .status{
    margin-left:auto;
    font-size:.82rem;
    opacity:.8;
  }

  .error-msg{
    color:#ffd7d2;
    font-size:.82rem;
  }

  /* ---------- Ticket container ---------- */
  .tickets-container{
    max-width:1400px;
    margin:28px auto;
    padding:0 24px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(430px, 1fr));
    gap:22px;
  }

  .empty-hint{
    text-align:center;
    color:#6b7686;
    padding:60px 20px;
    font-size:1rem;
  }

  /* ---------- Ticket card ---------- */
  .ticket{
    background:var(--paper);
    border:2px solid var(--grid-line);
    border-radius:8px;
    padding:10px 12px 12px;
    break-inside:avoid;
    page-break-inside:avoid;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }

  .ticket-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:2px solid var(--grid-line);
  }

  .ticket-header .ticket-title{
    font-weight:700;
    font-size:.95rem;
    letter-spacing:.3px;
  }

  .ticket-header .ticket-answer{
    font-size:.55rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#9aa3ad;
    transform:rotate(180deg);
    display:inline-block;
    cursor:default;
  }

  .ticket-riddle{
    margin-top:5px;
    font-size:.6rem;
    line-height:1.3;
    color:#8a94a3;
    font-style:italic;
    text-align:center;
  }

  table.ticket-grid{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
  }

  table.ticket-grid td{
    border:1.5px solid var(--grid-line);
    text-align:center;
    vertical-align:middle;
    height:42px;
    font-size:1.05rem;
    font-weight:700;
    color:var(--ink);
  }

  table.ticket-grid td.blank{
    background:var(--blank-bg);
  }

  table.ticket-grid td.filled{
    background:#fff;
  }

  .ticket-footer{
    margin-top:6px;
    display:flex;
    justify-content:space-between;
    font-size:.65rem;
    color:#8a94a3;
    letter-spacing:.4px;
  }

  /* ---------- Print styles ---------- */
  @media print{
    @page{
      size:A4;
      margin:10mm 8mm;
    }

    body{
      background:#fff;
      padding:0;
      margin:0;
    }

    .toolbar,
    .no-print{
      display:none !important;
    }

    .tickets-container{
      max-width:none;
      margin:0;
      padding:0;
      display:grid;
      grid-template-columns:repeat(var(--print-cols, 2), 1fr);
      gap:6mm;
    }

    .ticket{
      box-shadow:none;
      border:1.5px solid #000;
      outline:1px dashed #999;
      outline-offset:5px;
      break-inside:avoid;
      page-break-inside:avoid;
    }

    .ticket-answer{
      font-size:7pt;
    }

    .ticket-riddle{
      font-size:7pt;
    }

    table.ticket-grid td{
      height:9mm;
      font-size:13pt;
      border-color:#000;
    }

    .ticket-header{
      border-bottom-color:#000;
    }

    /* Page-break rule is injected dynamically as #dynamicPrintStyle,
       based on the "Tickets per page" selector, so it can target
       nth-of-type(Nn+1) where N = tickets per page. */
  }
</style>
</head>
<body>

  <div class="toolbar no-print">
    <h1>🎟️ Housie / Tambola Generator</h1>

    <div class="field">
      <label for="ticketCount">Number of tickets</label>
      <input type="number" id="ticketCount" min="1" max="500" value="6">
    </div>

    <div class="field">
      <label for="rowsInput">Rows</label>
      <input type="number" id="rowsInput" min="1" max="10" value="3">
    </div>

    <div class="field">
      <label for="colsInput">Columns</label>
      <input type="number" id="colsInput" min="1" max="15" value="9">
    </div>

    <div class="field">
      <label for="numsPerRowInput">Numbers per row</label>
      <input type="number" id="numsPerRowInput" min="1" max="15" value="5">
    </div>

    <div class="field">
      <label for="minNumInput">Min number</label>
      <input type="number" id="minNumInput" value="1">
    </div>

    <div class="field">
      <label for="maxNumInput">Max number</label>
      <input type="number" id="maxNumInput" value="90">
    </div>

    <div class="field">
      <label for="perPageSelect">Tickets per printed page</label>
      <select id="perPageSelect">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="6" selected>6</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="12">12</option>
      </select>
    </div>

    <button id="generateBtn">Generate Tickets</button>
    <button id="printBtn">Print Tickets</button>

    <span class="status" id="statusMsg"></span>
  </div>

  <div class="tickets-container" id="ticketsContainer">
    <div class="empty-hint">No tickets generated yet — choose a count above and click <strong>Generate Tickets</strong>.</div>
  </div>

<script>
(function(){
  "use strict";

  // Rows, columns, numbers-per-row and the number range are now configurable
  // via the toolbar inputs and are read fresh on every generate — see
  // readGridConfig() below. The values here are just fallback defaults.
  const DEFAULT_ROWS = 3;
  const DEFAULT_COLS = 9;
  const DEFAULT_NUMS_PER_ROW = 5;
  const DEFAULT_MIN = 1;
  const DEFAULT_MAX = 90;

  // Small joke/riddle bank — every answer is exactly ONE word.
  const RIDDLES = [
    { q: "I have keys but no locks, space but no room. What am I?", a: "KEYBOARD" },
    { q: "What has a face and two hands but no arms or legs?", a: "CLOCK" },
    { q: "What gets wetter the more it dries?", a: "TOWEL" },
    { q: "What has an eye but cannot see?", a: "NEEDLE" },
    { q: "What has to be broken before you can use it?", a: "EGG" },
    { q: "I'm tall when young, short when old. What am I?", a: "CANDLE" },
    { q: "What runs but never walks?", a: "WATER" },
    { q: "What has many teeth but cannot bite?", a: "COMB" },
    { q: "What has a neck but no head?", a: "BOTTLE" },
    { q: "What can travel around the world while staying in a corner?", a: "STAMP" },
    { q: "What has hands but cannot clap?", a: "CLOCK" },
    { q: "What kind of coat can only be put on when wet?", a: "PAINT" },
    { q: "What goes up but never comes down?", a: "AGE" },
    { q: "What has one head, one foot, and four legs?", a: "BED" },
    { q: "What invention lets you look right through a wall?", a: "WINDOW" },
    { q: "What can you catch but never throw?", a: "COLD" },
    { q: "What has a thumb and four fingers but isn't alive?", a: "GLOVE" },
    { q: "What starts with T, ends with T, and is full of T?", a: "TEAPOT" },
    { q: "What has legs but doesn't walk?", a: "TABLE" },
    { q: "What building has the most stories?", a: "LIBRARY" },
    { q: "What can you break without touching it?", a: "PROMISE" },
    { q: "What has a bed but never sleeps?", a: "RIVER" },
    { q: "What five-letter word becomes shorter when you add two letters to it?", a: "SHORT" },
    { q: "What has many rings but no fingers?", a: "TELEPHONE" },
    { q: "What has 88 keys but can't open a single door?", a: "PIANO" }
  ];

  // Never repeats a puzzle within one batch: bank riddles first (each once),
  // then freshly generated math / sequence puzzles, de-duplicated by text.
  function getRiddleSequence(count){
    const used = new Set();
    const seq = [];
    const add = (q, a) => {
      if(used.has(q)) return false;
      used.add(q);
      seq.push({ q, a: String(a) });
      return true;
    };
    shuffle([...RIDDLES]).forEach(r => { if(seq.length < count) add(r.q, r.a); });

    const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
    let guard = 0;
    while(seq.length < count && guard++ < 200000){
      const t = rnd(0, 2);
      if(t === 0){
        const a = rnd(11, 40), b = rnd(3, 19);
        add(`What is ${a} × ${b}?`, a * b);
      } else if(t === 1){
        const start = rnd(1, 30), step = rnd(2, 12);
        const terms = [0,1,2,3].map(i => start + i * step);
        add(`Next number? ${terms.join(', ')}, ?`, start + 4 * step);
      } else {
        const a = rnd(100, 999), b = rnd(21, 99);
        add(`What is ${a} − ${b}?`, a - b);
      }
    }
    return seq;
  }


  const container       = document.getElementById('ticketsContainer');
  const countInput      = document.getElementById('ticketCount');
  const genBtn          = document.getElementById('generateBtn');
  const printBtn        = document.getElementById('printBtn');
  const statusMsg       = document.getElementById('statusMsg');
  const perPageSelect   = document.getElementById('perPageSelect');
  const rowsInput       = document.getElementById('rowsInput');
  const colsInput       = document.getElementById('colsInput');
  const numsPerRowInput = document.getElementById('numsPerRowInput');
  const minNumInput     = document.getElementById('minNumInput');
  const maxNumInput     = document.getElementById('maxNumInput');

  // Suggest a sensible "numbers per row" whenever columns changes, using the
  // same ratio as classic Housie (5 filled out of 9 columns). The user can
  // still override it by hand before generating.
  function suggestNumsPerRow(cols){
    return Math.min(cols, Math.max(1, Math.round(cols * 5 / 9)));
  }
  colsInput.addEventListener('change', () => {
    const cols = Math.max(1, parseInt(colsInput.value, 10) || DEFAULT_COLS);
    numsPerRowInput.value = suggestNumsPerRow(cols);
  });

  // Split [min, max] into `cols` contiguous, nearly-equal-sized bands —
  // this generalizes the classic fixed 1-9/10-19/.../80-90 Housie bands
  // to any range and any column count.
  function computeColumnRanges(min, max, cols){
    const total = max - min + 1;
    const base = Math.floor(total / cols);
    let extra = total % cols;
    const ranges = [];
    let start = min;
    for(let i = 0; i < cols; i++){
      const size = base + (extra > 0 ? 1 : 0);
      if(extra > 0) extra--;
      const end = start + size - 1;
      ranges.push([start, end]);
      start = end + 1;
    }
    return ranges;
  }

  // Reads + validates the grid configuration from the toolbar. Throws with
  // a user-facing message if the combination is impossible.
  function readGridConfig(){
    const rows = Math.min(10, Math.max(1, parseInt(rowsInput.value, 10) || DEFAULT_ROWS));
    const cols = Math.min(15, Math.max(1, parseInt(colsInput.value, 10) || DEFAULT_COLS));
    let numsPerRow = parseInt(numsPerRowInput.value, 10);
    if(isNaN(numsPerRow) || numsPerRow < 1) numsPerRow = suggestNumsPerRow(cols);
    numsPerRow = Math.min(cols, numsPerRow);

    let min = parseInt(minNumInput.value, 10);
    let max = parseInt(maxNumInput.value, 10);
    if(isNaN(min)) min = DEFAULT_MIN;
    if(isNaN(max)) max = DEFAULT_MAX;

    // Reflect any clamping back into the UI so the user sees what was used.
    rowsInput.value = rows;
    colsInput.value = cols;
    numsPerRowInput.value = numsPerRow;

    if(max <= min){
      throw new Error('Max number must be greater than min number.');
    }

    const rangeSize = max - min + 1;
    if(rangeSize < cols){
      throw new Error(`Range (${rangeSize} numbers) is too small for ${cols} columns — need at least ${cols}.`);
    }

    const ranges = computeColumnRanges(min, max, cols);
    const smallestBand = Math.min(...ranges.map(([a, b]) => b - a + 1));
    if(smallestBand < rows){
      throw new Error(`Range is too small for ${rows} rows across ${cols} columns — widen the range or reduce rows/columns.`);
    }

    return { rows, cols, numsPerRow, min, max, ranges };
  }

  // How many grid columns look best for a given "tickets per page" count.
  const COLS_FOR_PER_PAGE = {
    1:1, 2:1, 3:1, 4:2, 5:2, 6:2, 8:2, 9:3, 12:3
  };

  function applyPrintLayout(){
    const perPage = Math.max(1, parseInt(perPageSelect.value, 10) || 6);
    const cols = COLS_FOR_PER_PAGE[perPage] || 2;

    let styleEl = document.getElementById('dynamicPrintStyle');
    if(!styleEl){
      styleEl = document.createElement('style');
      styleEl.id = 'dynamicPrintStyle';
      document.head.appendChild(styleEl);
    }

    styleEl.textContent = `
      @media print{
        .tickets-container{ --print-cols:${cols}; }
        .ticket:nth-of-type(${perPage}n+1){ break-before:page; }
      }
    `;
  }

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Decide how many numbers each column gets (0..rows each, total = rows * numsPerRow)
  function generateColumnCounts(rows, cols, numsPerRow){
    const total = rows * numsPerRow;
    // Start everyone at 0, then hand out `total` numbers one at a time to
    // random eligible columns (eligible = hasn't hit `rows` yet).
    const counts = new Array(cols).fill(0);
    let remaining = total;
    let guard = 0;
    const maxGuard = Math.max(10000, total * 200);
    while(remaining > 0 && guard < maxGuard){
      guard++;
      const idx = Math.floor(Math.random() * cols);
      if(counts[idx] < rows){
        counts[idx]++;
        remaining--;
      }
    }
    if(remaining > 0) return null; // couldn't place everyone, caller should retry/fail
    return counts;
  }

  // Assign which rows (0,1,2) each column's numbers fall into, so that
  // every row ends up with exactly NUMS_PER_ROW filled cells.
  // Uses a Gale-Ryser style greedy: process columns with the largest
  // remaining count first, always filling the rows with the most
  // remaining capacity -> guarantees a feasible, balanced result.
  function assignRowsToColumns(counts, rows, cols, numsPerRow){
    const rowRemaining = new Array(rows).fill(numsPerRow);
    const colOrder = shuffle([...Array(cols).keys()])
      .sort((a, b) => counts[b] - counts[a]); // stable sort keeps shuffled tie order

    const assignment = new Array(cols);

    for(const col of colOrder){
      const c = counts[col];
      let rowsIdx = shuffle([...Array(rows).keys()]);
      rowsIdx.sort((a, b) => rowRemaining[b] - rowRemaining[a]);
      const chosen = rowsIdx.slice(0, c);

      // Safety: never choose a row that's already full.
      for(const r of chosen){
        if(rowRemaining[r] <= 0) return null; // signal caller to retry
        rowRemaining[r]--;
      }
      chosen.sort((a, b) => a - b);
      assignment[col] = chosen;
    }

    if(rowRemaining.some(r => r !== 0)) return null;
    return assignment;
  }

  function randomNumbersInRange(min, max, count){
    const pool = [];
    for(let n = min; n <= max; n++) pool.push(n);
    shuffle(pool);
    return pool.slice(0, count).sort((a, b) => a - b);
  }

  // Builds one ticket: a rows x cols grid, null = blank cell
  function buildTicket(config){
    const { rows, cols, numsPerRow, ranges } = config;
    let assignment = null;
    let counts = null;
    let attempts = 0;

    while(assignment === null && attempts < 200){
      counts = generateColumnCounts(rows, cols, numsPerRow);
      assignment = counts ? assignRowsToColumns(counts, rows, cols, numsPerRow) : null;
      attempts++;
    }
    if(assignment === null){
      throw new Error("Failed to build a valid ticket layout for this row/column/range combination — try different values.");
    }

    const grid = Array.from({length: rows}, () => new Array(cols).fill(null));

    for(let col = 0; col < cols; col++){
      const rowsForCol = assignment[col];
      if(rowsForCol.length === 0) continue;
      const [min, max] = ranges[col];
      const nums = randomNumbersInRange(min, max, rowsForCol.length);
      rowsForCol.forEach((r, i) => { grid[r][col] = nums[i]; });
    }

    return grid;
  }

  function ticketKey(grid){
    return grid.map(row => row.map(c => c === null ? '.' : c).join(',')).join('|');
  }

  function generateUniqueTickets(n, config){
    const seen = new Set();
    const tickets = [];
    let safety = 0;
    const maxSafety = n * 500 + 2000;

    while(tickets.length < n && safety < maxSafety){
      safety++;
      const grid = buildTicket(config);
      const key = ticketKey(grid);
      if(seen.has(key)) continue;
      seen.add(key);
      tickets.push(grid);
    }

    if(tickets.length < n){
      throw new Error(`Could only generate ${tickets.length} unique ticket(s) with this configuration — try a smaller batch, a wider range, or fewer numbers per row.`);
    }
    return tickets;
  }

  function pad3(n){
    return String(n).padStart(3, '0');
  }

  function renderTickets(tickets, riddles, config){
    container.innerHTML = '';
    const { rows, cols, numsPerRow } = config;
    const totalNumbers = rows * numsPerRow;

    tickets.forEach((grid, idx) => {
      const riddle = riddles[idx];

      const ticketDiv = document.createElement('div');
      ticketDiv.className = 'ticket';

      const header = document.createElement('div');
      header.className = 'ticket-header';
      header.innerHTML = `
        <span class="ticket-title">Ticket #${pad3(idx + 1)}</span>
        <span class="ticket-answer" title="Riddle answer">${riddle.a}</span>
      `;
      ticketDiv.appendChild(header);

      const table = document.createElement('table');
      table.className = 'ticket-grid';
      const tbody = document.createElement('tbody');

      for(let r = 0; r < rows; r++){
        const tr = document.createElement('tr');
        for(let c = 0; c < cols; c++){
          const td = document.createElement('td');
          const val = grid[r][c];
          if(val === null){
            td.className = 'blank';
            td.innerHTML = '&nbsp;';
          } else {
            td.className = 'filled';
            td.textContent = val;
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }

      table.appendChild(tbody);
      ticketDiv.appendChild(table);

      const footer = document.createElement('div');
      footer.className = 'ticket-footer';
      footer.innerHTML = `<span>Ticket ${idx + 1} of ${tickets.length}</span><span>${rows} rows · ${cols} cols · ${totalNumbers} numbers</span>`;
      ticketDiv.appendChild(footer);

      const riddleDiv = document.createElement('div');
      riddleDiv.className = 'ticket-riddle';
      riddleDiv.textContent = `🤔 ${riddle.q}`;
      ticketDiv.appendChild(riddleDiv);

      container.appendChild(ticketDiv);
    });
  }

  function handleGenerate(){
    const raw = parseInt(countInput.value, 10);
    const count = Math.min(500, Math.max(1, isNaN(raw) ? 1 : raw));
    countInput.value = count;

    statusMsg.textContent = 'Generating…';
    statusMsg.classList.remove('error-msg');

    // Let the UI paint the "Generating…" message before the (synchronous) work runs
    setTimeout(() => {
      try{
        const config = readGridConfig(); // throws on invalid rows/cols/range combos
        const tickets = generateUniqueTickets(count, config);
        const riddles = getRiddleSequence(tickets.length);
        renderTickets(tickets, riddles, config);
        statusMsg.textContent = `${tickets.length} ticket${tickets.length > 1 ? 's' : ''} generated.`;
      } catch(err){
        statusMsg.textContent = err.message;
        statusMsg.classList.add('error-msg');
      }
    }, 10);
  }

  genBtn.addEventListener('click', handleGenerate);
  perPageSelect.addEventListener('change', applyPrintLayout);
  printBtn.addEventListener('click', () => {
    applyPrintLayout();
    window.print();
  });
  // Also cover Ctrl+P / browser print menu, not just the button
  window.addEventListener('beforeprint', applyPrintLayout);

  // Generate an initial batch on load
  applyPrintLayout();
  handleGenerate();
})();
</script>

</body>
</html>
